name: Run Hooksmith
description: Run a Hooksmith event using the CLI version that matches this action release.
author: Renato Golia

inputs:
  event:
    description: Path to the YAML or JSON event document, relative to the workspace.
    required: true
  config:
    description: Path to the Hooksmith configuration module, relative to the workspace.
    required: false
    default: hooksmith.config.ts
  plan:
    description: Evaluate routing without invoking listeners.
    required: false
    default: "false"
  log:
    description: Minimum Hooksmith log level (trace, debug, info, warn, error, or none).
    required: false
    default: info
  report-path:
    description: Optional path where the JSON run report is written, relative to the workspace unless absolute.
    required: false
  show-report:
    description: Print the captured JSON report when one is produced, including failed runs.
    required: false
    default: "true"
  minimum-dependency-age:
    description: Minimum dependency age passed to Deno. Uses Deno's native syntax; defaults to 0 to allow freshly published packages.
    required: false
    default: "0"

outputs:
  success:
    description: Whether the Hooksmith run succeeded.
    value: ${{ steps.run.outputs.success }}
  mode:
    description: Hooksmith execution mode (run or plan).
    value: ${{ steps.run.outputs.mode }}
  report-path:
    description: Absolute path to the generated JSON report, or empty when the CLI fails before producing one.
    value: ${{ steps.run.outputs.report-path }}

runs:
  using: composite
  steps:
    - name: Set up Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Run Hooksmith
      id: run
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        HOOKSMITH_EVENT: ${{ inputs.event }}
        HOOKSMITH_CONFIG: ${{ inputs.config }}
        HOOKSMITH_PLAN: ${{ inputs.plan }}
        HOOKSMITH_LOG: ${{ inputs.log }}
        HOOKSMITH_REPORT_PATH: ${{ inputs.report-path }}
        HOOKSMITH_SHOW_REPORT: ${{ inputs.show-report }}
        HOOKSMITH_MINIMUM_DEPENDENCY_AGE: ${{ inputs.minimum-dependency-age }}
      run: bash "$GITHUB_ACTION_PATH/scripts/run-action.sh"

branding:
  icon: zap
  color: gray-dark
